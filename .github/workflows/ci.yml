name: CI - CRUD Web Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias de lint
        run: npm install -g html-validate

      - name: Validar sintaxis HTML
        run: html-validate *.html || true

      - name: Generar artefacto ZIP del proyecto
        run: zip -r crud-web-v1.0.0.zip . --exclude "*.git*"

      - name: Subir artefacto
        uses: actions/upload-artifact@v3
        with:
          name: crud-web-release
          path: crud-web-v1.0.0.zip
